<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>YouTube Clone — Home</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <a href="index.html">▶ CloneTube</a>
    <nav>
      <a href="upload.html">Upload</a>
    </nav>
  </header>

  <main>
    <h2>Home feed</h2>
    <div id="feed" class="grid">Loading videos…</div>
  </main>

  <script>
    const API_BASE = "https://youtube-app-tdxg.onrender.com";

    async function loadFeed() {
      const feedEl = document.getElementById("feed");
      try {
        const res = await fetch(`${API_BASE}/api/videos`);
        const data = await res.json();

        if (!data.videos.length) {
          feedEl.innerHTML = "<p>No videos yet. Go upload one!</p>";
          return;
        }

        feedEl.innerHTML = data.videos
          .map(
            (v) => `
          <div class="card">
            <div onclick="location.href='watch.html?id=${v._id}'">
              <img src="${v.thumbnailUrl || ""}" onerror="this.style.background='#272727'" />
              <h3>${escapeHtml(v.title)}</h3>
              <p>${escapeHtml(v.description || "")}</p>
              <span class="badge">${data.source}</span>
            </div>
            <button onclick="deleteVideo('${v._id}', event)" style="margin-top:6px;background:#c0392b;color:white;border:none;padding:6px 10px;border-radius:4px;cursor:pointer;">Delete</button>
          </div>
        `
          )
          .join("");
      } catch (err) {
        feedEl.innerHTML = "Failed to load feed. Is the API server running?";
        console.error(err);
      }
    }

    async function deleteVideo(id, event) {
      event.stopPropagation();
      if (!confirm("Delete this video?")) return;
      try {
        const res = await fetch(`${API_BASE}/api/videos/${id}`, { method: "DELETE" });
        if (!res.ok) throw new Error("delete failed");
        loadFeed();
      } catch (err) {
        alert("Failed to delete video.");
        console.error(err);
      }
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    loadFeed();
  </script>
</body>
</html>
