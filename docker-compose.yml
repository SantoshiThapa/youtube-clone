version: "3.8"

# These two containers stand in for the book's "Metadata DB" (MongoDB)
# and "Metadata Cache" / message queue backend (Redis, also used by BullMQ
# as the Completion Queue).
services:
  mongo:
    image: mongo:7
    container_name: yt-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: yt-redis
    ports:
      - "6379:6379"

volumes:
  mongo-data:
